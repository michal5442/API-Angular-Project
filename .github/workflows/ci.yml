name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  api:
    name: Build & Test API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web api

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore WebAopiShop.sln

      - name: Build
        run: dotnet build WebAopiShop.sln --no-restore -c Release

      - name: Test
        run: dotnet test WebAopiShop.sln --no-build -c Release --verbosity normal

  angular:
    name: Build Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Angular

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Angular/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npx ng build --configuration production

  ai-service:
    name: Lint AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax
        run: python -m py_compile chat_service.py
